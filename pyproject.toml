[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-m0de"
version = "0.1.0"
description = "Local network device cataloger, scanner, and TUI with SQLite flatfile diff tracking."
authors = [{name = "Antigravity User"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.50.0",
    "netifaces>=0.11.0",
]

[project.scripts]
scan-m0de = "scan_m0de.cli:main"
