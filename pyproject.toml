[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-m0de"
version = "0.1.0"
description = "Local network device cataloger, scanner, and TUI with SQLite flatfile diff tracking."
authors = [{name = "Antigravity User"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.50.0",
    "netifaces>=0.11.0",
]

[project.scripts]
scan-m0de = "scan_m0de.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scan_m0de*"]
exclude = ["tmp*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line length violations handled by ruff format
]
